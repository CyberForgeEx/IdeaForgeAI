<!-- index.html -->
{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="mb-4">Welcome to Idea Evaluator</h1>
        <p class="lead">Evaluate your software project ideas with AI-powered insights.</p>
        {% if not session.user_id %}
        <a href="{{ url_for('login') }}" class="btn btn-primary me-2">Login</a>
        <a href="{{ url_for('register') }}" class="btn btn-outline-primary">Register</a>
        {% else %}
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
        {% endif %}
    </div>
</div>
{% endblock %}
